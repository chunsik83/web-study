<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정말 간단 TODO 리스트</title>

    <!-- 부트스트랩입력 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>    

    <!-- 폰트설정 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">     

    <!-- 스타일시트 위치 지정 -->
    <link rel="stylesheet" href="./main.css"/> 

</head>
<body>
    <div class="container" id="container">
        <h3 id="title">정말 간단 TODO 리스트</h3>
        <div id="sub-container">
            <ul class="list-group" id="list-group">
                <li class="list-group-item todo-item d-flex justify-content-between align-items-center list-0">
                  오늘의 할 일 목록 하나!
                  <span class="badge bg-primary rounded-pill" onclick="deleteTodo(0)">삭제</span>
                </li>          
              </ul>                       
        </div>
        <div class="input-group mb-3" id="input-group">
            <input type="text" class="form-control" id="input-area" placeholder="할 일을 입력하세요">
            <button class="btn btn-outline-secondary" type="button" id="button-area" onclick="addTodo()">
                추가
            </button>
        </div>
    </div>

<script>
    $(document).ready(function(){
        console.log("시작!")

        // 엔터로도 추가되게
        $("#input-area").on("keyup", function(e){
            if(e.key === "Enter"){
                addTodo()
            }
        })
    })

    function addTodo(){
        let todo = $("#input-area").val().trim()

        // 빈 값이면 추가하지 않는다
        if(todo === ""){
            return
        }

        let id = Math.floor(Math.random() * 100000)

        let list_item = `<li class="list-group-item todo-item d-flex justify-content-between align-items-center list-${id}">
                  ${todo}
                  <span class="badge bg-primary rounded-pill" onclick="deleteTodo(${id})">삭제</span>
        </li>`       
        
        $('#list-group').append(list_item)
        $('#input-area').val('')
    }

    function deleteTodo(id){   
        $(".list-" + id).remove()
    }
</script>
</body>
</html>
